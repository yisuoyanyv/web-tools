<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码生成器 - Web Tools</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <div class="container">
        <a href="../../index.html" class="back-link">← 返回首页</a>

        <div class="tool-content">
            <h1>🔐 密码生成器</h1>
            <p>快速生成强密码，支持自定义长度和字符类型</p>

            <div style="margin-top: 30px; max-width: 600px;">
                <h2>密码设置</h2>

                <label for="passwordLength">密码长度：</label>
                <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                    <input type="range" id="passwordLength" min="8" max="64" value="16" style="flex: 1;">
                    <input type="number" id="passwordLengthValue" min="8" max="64" value="16" style="width: 80px;">
                </div>

                <div style="margin-bottom: 20px;">
                    <label>
                        <input type="checkbox" id="uppercase" checked> 大写字母 (A-Z)
                    </label>
                    <br>
                    <label>
                        <input type="checkbox" id="lowercase" checked> 小写字母 (a-z)
                    </label>
                    <br>
                    <label>
                        <input type="checkbox" id="numbers" checked> 数字 (0-9)
                    </label>
                    <br>
                    <label>
                        <input type="checkbox" id="symbols" checked> 特殊符号 (!@#$...)
                    </label>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button onclick="generatePassword()" style="flex: 1;">生成密码</button>
                    <button onclick="regeneratePassword()" style="flex: 1;">刷新</button>
                </div>

                <div class="result-box" style="margin-top: 20px;">
                    <p style="font-size: 1.2rem; font-weight: bold; word-break: break-all;" id="generatedPassword">点击生成获得密码</p>
                    <button onclick="copyPassword()" style="width: 100%; margin-top: 10px;">复制密码</button>
                </div>
            </div>

            <div style="margin-top: 40px;">
                <h2>使用说明</h2>
                <ul style="line-height: 2;">
                    <li>使用滑块或输入框设置密码长度（8-64 字符）</li>
                    <li>选择要包含的字符类型</li>
                    <li>点击"生成密码"获得新的随机密码</li>
                    <li>点击"复制密码"将密码复制到剪贴板</li>
                    <li>密码强度与包含的字符类型和长度有关</li>
                </ul>
            </div>

            <div style="margin-top: 30px; padding: 20px; background-color: #f0f4ff; border-radius: 8px;">
                <h3>💡 强密码建议</h3>
                <ul style="line-height: 2;">
                    <li>至少 12 个字符，越长越好</li>
                    <li>同时使用大小写字母、数字和特殊符号</li>
                    <li>避免使用常见的单词或数字序列</li>
                    <li>定期更换密码，特别是重要账户</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        const PASSWORD_CHARS = {
            uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
            lowercase: 'abcdefghijklmnopqrstuvwxyz',
            numbers: '0123456789',
            symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
        };

        // 绑定长度同步
        document.getElementById('passwordLength').addEventListener('input', (e) => {
            document.getElementById('passwordLengthValue').value = e.target.value;
        });

        document.getElementById('passwordLengthValue').addEventListener('input', (e) => {
            document.getElementById('passwordLength').value = e.target.value;
        });

        function generatePassword() {
            const length = parseInt(document.getElementById('passwordLength').value);
            const useUppercase = document.getElementById('uppercase').checked;
            const useLowercase = document.getElementById('lowercase').checked;
            const useNumbers = document.getElementById('numbers').checked;
            const useSymbols = document.getElementById('symbols').checked;

            if (!useUppercase && !useLowercase && !useNumbers && !useSymbols) {
                alert('请至少选择一种字符类型');
                return;
            }

            let chars = '';
            if (useUppercase) chars += PASSWORD_CHARS.uppercase;
            if (useLowercase) chars += PASSWORD_CHARS.lowercase;
            if (useNumbers) chars += PASSWORD_CHARS.numbers;
            if (useSymbols) chars += PASSWORD_CHARS.symbols;

            let password = '';
            for (let i = 0; i < length; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }

            document.getElementById('generatedPassword').textContent = password;
        }

        function regeneratePassword() {
            generatePassword();
        }

        function copyPassword() {
            const password = document.getElementById('generatedPassword').textContent;
            
            if (password === '点击生成获得密码') {
                alert('请先生成密码');
                return;
            }

            navigator.clipboard.writeText(password).then(() => {
                alert('密码已复制到剪贴板');
            }).catch(() => {
                // 降级方案
                const textarea = document.createElement('textarea');
                textarea.value = password;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert('密码已复制到剪贴板');
            });
        }

        // 页面加载时生成一个默认密码
        window.addEventListener('load', () => {
            generatePassword();
        });
    </script>
</body>
</html>
