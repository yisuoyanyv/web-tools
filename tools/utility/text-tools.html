<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本工具 - Web Tools</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <div class="container">
        <a href="../../index.html" class="back-link">← 返回首页</a>

        <div class="tool-content">
            <h1>✍️ 文本工具</h1>
            <p>大小写转换、字数统计、去重、反转等常用文本处理</p>

            <div style="margin-top: 30px;">
                <label for="textInput">输入文本：</label>
                <textarea id="textInput" rows="10" placeholder="在此输入或粘贴文本..."></textarea>

                <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px;">
                    <button onclick="toUpper()">全部大写</button>
                    <button onclick="toLower()">全部小写</button>
                    <button onclick="toTitle()">首字母大写</button>
                    <button onclick="reverseText()">反转文本</button>
                    <button onclick="dedupeLines()">行去重</button>
                    <button onclick="trimLines()">去除首尾空格</button>
                    <button onclick="sortLines()">按行排序</button>
                    <button onclick="clearText()" style="background-color: #6b7280;">清空</button>
                </div>

                <div class="result-box" style="margin-top: 0;">
                    <p><strong>字符数：</strong> <span id="charCount">0</span>（不含换行：<span id="charNoNewline">0</span>）</p>
                    <p><strong>字数（按空白分词）：</strong> <span id="wordCount">0</span></p>
                    <p><strong>行数：</strong> <span id="lineCount">0</span></p>
                </div>

                <div style="margin-top: 15px;">
                    <button onclick="copyText()" style="background-color: #10b981;">复制当前文本</button>
                </div>
            </div>

            <div style="margin-top: 40px; padding: 20px; background-color: #f0f4ff; border-radius: 8px;">
                <h3>💡 功能说明</h3>
                <ul style="line-height: 2;">
                    <li>统计会随输入实时更新</li>
                    <li>「行去重」保留首次出现的行</li>
                    <li>「按行排序」按 Unicode 字典序升序</li>
                    <li>所有操作均在本地完成</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        const input = document.getElementById('textInput');

        function updateStats() {
            const text = input.value;
            const noNewline = text.replace(/\r?\n/g, '');
            const words = text.trim() === '' ? [] : text.trim().split(/\s+/);
            const lines = text === '' ? [] : text.split(/\r?\n/);

            document.getElementById('charCount').textContent = text.length;
            document.getElementById('charNoNewline').textContent = noNewline.length;
            document.getElementById('wordCount').textContent = words.length;
            document.getElementById('lineCount').textContent = lines.length;
        }

        function toUpper() {
            input.value = input.value.toUpperCase();
            updateStats();
        }

        function toLower() {
            input.value = input.value.toLowerCase();
            updateStats();
        }

        function toTitle() {
            input.value = input.value.replace(/\w\S*/g, (w) =>
                w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()
            );
            updateStats();
        }

        function reverseText() {
            input.value = [...input.value].reverse().join('');
            updateStats();
        }

        function dedupeLines() {
            const lines = input.value.split(/\r?\n/);
            const seen = new Set();
            const result = [];
            for (const line of lines) {
                if (!seen.has(line)) {
                    seen.add(line);
                    result.push(line);
                }
            }
            input.value = result.join('\n');
            updateStats();
        }

        function trimLines() {
            input.value = input.value.split(/\r?\n/).map(l => l.trim()).join('\n');
            updateStats();
        }

        function sortLines() {
            const lines = input.value.split(/\r?\n/);
            lines.sort((a, b) => a.localeCompare(b, 'zh-CN'));
            input.value = lines.join('\n');
            updateStats();
        }

        function clearText() {
            input.value = '';
            updateStats();
        }

        function copyText() {
            if (!input.value) {
                alert('没有可复制的内容');
                return;
            }
            navigator.clipboard.writeText(input.value).then(() => {
                alert('已复制到剪贴板');
            }).catch(() => {
                input.select();
                document.execCommand('copy');
                alert('已复制到剪贴板');
            });
        }

        input.addEventListener('input', updateStats);
        updateStats();
    </script>
</body>
</html>
